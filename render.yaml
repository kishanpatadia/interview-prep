services:
  - type: web
    name: interview-prep-agent
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually in Render dashboard — never commit real keys
      - key: CLAUDE_MODEL
        value: claude-sonnet

