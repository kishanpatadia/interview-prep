services:
  - type: web
    name: interview-prep-agent
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually in Render dashboard — never commit real keys
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: GOOGLE_API_KEY
        sync: false          # set manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: VOYAGE_API_KEY
        sync: false          # set manually in Render dashboard
      - key: VOYAGE_MODEL
        value: voyage-3-lite
      - key: ADMIN_SEED_SECRET
        generateValue: true  # Render generates a random value — used to auth POST /admin/seed
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: ./data/prep.db
      - key: SEED_TOPIC
        value: "Adobe Commerce (Magento) Architect-level interview prep"
      - key: SEED_COUNT
        value: 70
      - key: DAILY_CLAUDE_CALL_LIMIT
        value: 50
      - key: RATE_LIMIT_PER_IP_PER_HOUR
        value: 15
